<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img"><title>Illustrative AI developer workstation</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060b1f"/><stop offset="1" stop-color="#02040c"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1a3d"/><stop offset="1" stop-color="#0a1226"/></linearGradient></defs>
<rect width="1200" height="900" fill="url(#bg)"/><rect width="1200" height="900" fill="url(#glow)"/>
<g stroke="#1e3a8a" stroke-opacity=".25"><path d="M0 700H1200M0 760H1200"/></g>
<!-- monitors -->
<g><rect x="90" y="250" width="320" height="230" rx="10" fill="#0a0f1f" stroke="#1e3a8a" stroke-width="3" transform="rotate(-4 250 365)"/><rect x="104" y="264" width="292" height="202" rx="4" fill="url(#scr)" transform="rotate(-4 250 365)"/>
<g transform="rotate(-4 250 365)" fill="#60a5fa"><rect x="124" y="290" width="120" height="8" rx="4"/><rect x="144" y="314" width="170" height="8" rx="4" fill="#93c5fd" opacity=".7"/><rect x="144" y="338" width="100" height="8" rx="4" opacity=".6"/><rect x="124" y="362" width="190" height="8" rx="4" fill="#2563eb"/><rect x="144" y="386" width="140" height="8" rx="4" opacity=".6"/><rect x="124" y="410" width="80" height="8" rx="4" fill="#93c5fd" opacity=".7"/></g></g>
<g><rect x="400" y="190" width="400" height="290" rx="12" fill="#0a0f1f" stroke="#2563eb" stroke-width="3"/><rect x="416" y="206" width="368" height="258" rx="5" fill="url(#scr)"/>
<rect x="436" y="230" width="150" height="100" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="620" y="270" width="130" height="90" fill="none" stroke="#60a5fa" stroke-width="3"/>
<polyline points="436,430 500,390 560,410 630,350 700,370 760,320" fill="none" stroke="#60a5fa" stroke-width="4"/>
<circle cx="630" cy="350" r="6" fill="#93c5fd"/><circle cx="760" cy="320" r="6" fill="#93c5fd"/></g>
<g><rect x="790" y="250" width="320" height="230" rx="10" fill="#0a0f1f" stroke="#1e3a8a" stroke-width="3" transform="rotate(4 950 365)"/><rect x="804" y="264" width="292" height="202" rx="4" fill="url(#scr)" transform="rotate(4 950 365)"/>
<g transform="rotate(4 950 365)" fill="#2563eb"><rect x="830" y="400" width="26" height="46"/><rect x="866" y="370" width="26" height="76" fill="#60a5fa"/><rect x="902" y="340" width="26" height="106"/><rect x="938" y="380" width="26" height="66" fill="#60a5fa"/><rect x="974" y="310" width="26" height="136"/><rect x="1010" y="350" width="26" height="96" fill="#60a5fa"/></g></g>
<!-- stands, desk -->
<g fill="#0a0f1f" stroke="#1e3a8a"><rect x="585" y="480" width="30" height="70"/><rect x="540" y="545" width="120" height="10" rx="4"/></g>
<rect x="0" y="600" width="1200" height="300" fill="#04070f"/><rect x="0" y="600" width="1200" height="6" fill="#1e3a8a" opacity=".6"/>
<!-- person from behind -->
<g fill="#050912" stroke="#1e3a8a" stroke-width="2"><circle cx="600" cy="610" r="62"/><path d="M470 900Q480 700 600 680Q720 700 730 900Z"/></g>
<rect x="520" y="660" width="160" height="14" rx="7" fill="#2563eb" opacity=".35"/>
<!-- keyboard -->
<rect x="470" y="640" width="260" height="14" rx="4" fill="#0f1a3a" opacity="0"/><rect x="430" y="740" width="340" height="22" rx="6" fill="#0a1226" stroke="#2563eb" stroke-opacity=".6"/>
</svg>
